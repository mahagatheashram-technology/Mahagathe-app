<style>

</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #FFFBF5; color: #2A1F1A; font-family: Poppins, sans-serif; display: flex; flex-direction: column; padding: 52px 20px 32px; gap: 22px;">
  <a href="SanghaV3.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #2A1F1A;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-family: Lora, serif; font-weight: 600; font-size: 32px;">Give dāna</h1>
    <p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.6; color: #6E5F50;">To the Mahagathe Foundation Public Charitable Trust.</p>
  </div>

  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
    <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px;">Where should it go?</legend>
    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E9DFD3; border-radius: 18px;">
      <label style="display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid #F0E8DE;">
        <input type="radio" name="p" style="width: 20px; height: 20px; accent-color: #C20000; margin: 0;">
        <span style="flex-grow: 1;"><span style="display: block; font-size: 15px; font-weight: 600;">Where it is most needed</span><span style="display: block; font-size: 12px; font-weight: 500; color: #6E5F50;">The Trust decides</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid #F0E8DE;">
        <input type="radio" name="p" checked style="width: 20px; height: 20px; accent-color: #C20000; margin: 0;">
        <span style="flex-grow: 1;"><span style="display: block; font-size: 15px; font-weight: 600;">Bhaṇḍāra</span><span style="display: block; font-size: 12px; font-weight: 500; color: #6E5F50;">Food for all</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 14px; padding: 15px 16px;">
        <input type="radio" name="p" style="width: 20px; height: 20px; accent-color: #C20000; margin: 0;">
        <span style="flex-grow: 1;"><span style="display: block; font-size: 15px; font-weight: 600;">Adhyaya</span><span style="display: block; font-size: 12px; font-weight: 500; color: #6E5F50;">Learning for children</span></span>
      </label>
    </div>
  </fieldset>

  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
    <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px;">Amount</legend>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <button type="button" style="height: 50px; border-radius: 14px; border: 1px solid #E9DFD3; background: #FFFFFF; font-size: 15px; font-weight: 500; color: #2A1F1A;">₹101</button>
      <button type="button" style="height: 50px; border-radius: 14px; border: 1px solid #E9DFD3; background: #FFFFFF; font-size: 15px; font-weight: 500; color: #2A1F1A;">₹501</button>
      <button type="button" aria-pressed="true" style="height: 50px; border-radius: 14px; border: 0; background: #C20000; font-size: 15px; color: #FFFFFF; font-weight: 600;">₹1,001</button>
      <button type="button" style="height: 50px; border-radius: 14px; border: 1px solid #E9DFD3; background: #FFFFFF; font-size: 15px; font-weight: 500; color: #2A1F1A;">₹2,501</button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E9DFD3;">
      <span style="font-size: 15px; font-weight: 500; color: #6E5F50;">₹</span>
      <input type="text" inputmode="numeric" placeholder="Other amount" aria-label="Other amount in rupees" style="flex-grow: 1; border: 0; outline: none; background: transparent; font-size: 15px; color: #2A1F1A;">
    </label>
  </fieldset>

  <div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #F0E8DE;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C20000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>
    <p style="margin: 0; font-size: 13px; font-weight: 500; line-height: 1.6;">Indian rupees only for now. The Trust can accept gifts from abroad once its FCRA registration is in place.</p>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 500;">You are giving <b style="font-weight: 600;">₹1,001</b> to <b style="font-weight: 600;">Bhaṇḍāra</b></p>
    <button type="button" style="height: 54px; border-radius: 999px; border: 0; background: #C20000; color: #FFFFFF; font-size: 16px; font-weight: 600;">Pay with UPI</button>
    <p style="margin: 0; text-align: center; font-size: 12px; font-weight: 500; color: #6E5F50;">You will see a receipt here after payment.</p>
  </div>
</div>
