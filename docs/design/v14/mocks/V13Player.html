<!doctype html><html><head><meta charset="utf-8"><title>V13Player</title><style>
@import url('https://fonts.googleapis.com/css2?family=Eczar:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=block');
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; }
.ph { width: 390px; min-height: 844px; background: #FBFAF7; color: #2A1E14; font-family: Mukta, sans-serif; font-size: 16px; line-height: 1.55; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.ez { font-family: Eczar, serif; }
a { color: inherit; text-decoration: none; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 14px; background: #C20000; color: #fff; font-weight: 600; font-size: 17px; }
.btn2 { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 14px; border: 1.5px solid currentColor; font-weight: 600; font-size: 15px; }
.lnk { font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.leaf { position: relative; border-radius: 16px; background: #E7D3A8; background-image: repeating-linear-gradient(0deg, rgba(120,90,40,.07) 0 1px, transparent 1px 7px); border: 1px solid #C9AE78; }
.hole { position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: #FBFAF7; box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
</style></head><body><div class="ph" style="background:#1F2347;color:#fff;">
<div style="height:54px;flex-shrink:0;"></div>
<div style="padding:0 16px;"><a style="display:inline-flex;align-items:center;gap:6px;height:44px;font-weight:600;color:#B9BCD9;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Close</a></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 28px 0;">
  <svg width="150" height="190" viewBox="0 0 150 190" aria-hidden="true">
  <defs><radialGradient id="g" cx="50%" cy="38%" r="50%"><stop offset="0" stop-color="#F2B544" stop-opacity=".45"/><stop offset="1" stop-color="#F2B544" stop-opacity="0"/></radialGradient></defs>
  <circle cx="75" cy="70" r="70" fill="url(#g)"/>
  <path d="M75 28c12 16 19 27 19 39a19 19 0 0 1-38 0c0-12 7-23 19-39z" fill="#F2B544"/>
  <path d="M75 50c5 7 8 12 8 17a8 8 0 0 1-16 0c0-5 3-10 8-17z" fill="#FFF3D6"/>
  <path d="M28 112h94c0 22-21 38-47 38s-47-16-47-38z" fill="none" stroke="#F2B544" stroke-width="2"/>
  <path d="M60 150l-8 18h46l-8-18" fill="none" stroke="#F2B544" stroke-width="2"/></svg>
  <p style="margin:24px 0 0;font-size:15px;color:#F2B544;">Sitting 11 of 40</p>
  <h1 class="ez" style="margin:2px 0 0;font-size:33px;font-weight:600;line-height:1.15;">Introductory Samatha</h1>
  <p style="margin:14px 0 0;font-size:17px;line-height:1.55;color:#B9BCD9;max-width:290px;">Sit upright, let the eyes close, and follow Mahamuni’s voice.</p>
</div>
<div style="padding:0 28px 54px;">
  <div style="height:4px;border-radius:2px;background:rgba(185,188,217,.25);position:relative;"><span style="position:absolute;left:-7px;top:-6px;width:16px;height:16px;border-radius:50%;background:#fff;"></span></div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:#B9BCD9;"><span>0:00</span><span>7:12</span></div>
  <div style="display:flex;justify-content:center;margin-top:18px;"><a aria-label="Play" style="width:80px;height:80px;border-radius:50%;background:#F2B544;color:#1F2347;display:flex;align-items:center;justify-content:center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></svg></a></div>
</div>
</div></body></html>
